name: Tutorial tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  arc-circle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc-circle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arc-circle/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
