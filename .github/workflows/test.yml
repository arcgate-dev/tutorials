name: Tutorial tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tutorials:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tutorial: [arc-circle, arc-metamask, arc-agent-box, arc-mcp, arc-claude-agent]
    defaults:
      run:
        working-directory: ${{ matrix.tutorial }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.tutorial }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck --if-present
